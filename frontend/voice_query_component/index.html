<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      margin: 0;
      background: transparent;
      color: #f4f8f5;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      overflow: hidden;
    }

    .voice-query {
      border: 1px solid rgba(103, 245, 150, 0.24);
      border-radius: 12px;
      background: rgba(11, 17, 12, 0.85);
      padding: 10px;
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr);
      gap: 10px;
      align-items: center;
      box-sizing: border-box;
    }

    .mic-button {
      border: 1px solid rgba(103, 245, 150, 0.42);
      border-radius: 10px;
      background: rgba(103, 245, 150, 0.1);
      color: #b8ffcb;
      height: 38px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 760;
      cursor: pointer;
      white-space: nowrap;
    }

    .mic-button.listening {
      border-color: rgba(103, 245, 150, 0.72);
      background: rgba(103, 245, 150, 0.16);
      color: #e2ffea;
    }

    .mic-button.waiting {
      border-color: rgba(103, 245, 150, 0.55);
      background: rgba(103, 245, 150, 0.12);
      color: #b8ffcb;
    }

    .mic-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #70f69c;
      box-shadow: 0 0 0 4px rgba(103, 245, 150, 0.16);
    }

    .mic-button.listening .mic-dot {
      animation: pulse 1s ease-in-out infinite;
    }

    .voice-panel {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(90px, 1fr) minmax(140px, 1.8fr);
      gap: 10px;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 38px;
      border-radius: 8px;
      background: rgba(5, 10, 6, 0.8);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .voice-status {
      color: #9caea1;
      font-size: 0.75rem;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .voice-preview {
      color: #f4f8f5;
      font-size: 0.78rem;
      line-height: 1.3;
      min-height: 1.3em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }

    @media (max-width: 560px) {
      .voice-query {
        grid-template-columns: auto minmax(0, 1fr);
        padding: 7px;
        gap: 8px;
      }
      .voice-panel { grid-template-columns: minmax(0, 1fr); }
      .voice-panel canvas { display: none; }
      .mic-button { padding: 0 9px; font-size: 0.77rem; }
    }
  </style>
</head>
<body>
  <div class="voice-query">
    <button class="mic-button" id="micButton" type="button" aria-label="Start conversation">
      <span class="mic-dot"></span>
      <span id="micLabel">Start conversation</span>
    </button>
    <div class="voice-panel">
      <canvas id="waveCanvas" width="260" height="76" aria-label="Input volume waves"></canvas>
      <div>
        <div class="voice-status" id="voiceStatus">Tap once and speak naturally.</div>
        <div class="voice-preview" id="voicePreview"></div>
      </div>
    </div>
  </div>

  <script>
    const button = document.getElementById("micButton");
    const label = document.getElementById("micLabel");
    const statusText = document.getElementById("voiceStatus");
    const preview = document.getElementById("voicePreview");
    const canvas = document.getElementById("waveCanvas");
    const painter = canvas.getContext("2d");
    const modeKey = "texmin_voice_conversation";
    const waitingKey = "texmin_voice_waiting_since";
    const resumeKey = "texmin_voice_resume_at";
    const interruptKey = "texmin_voice_interrupt_at";
    const speakingKey = "texmin_voice_avatar_speaking_at";
    let sessionId = "";
    let settings = {};
    let phase = "idle";
    let generation = 0;
    let requestId = "";
    let ownInterruptAt = 0;
    let beginAck = null;
    let stream = null;
    let context = null;
    let analyser = null;
    let samples = null;
    let recorder = null;
    let chunks = [];
    let mime = "";
    let raf = 0;
    let startedAt = 0;
    let lastSpeechAt = 0;
    let candidateAt = 0;
    let heardSpeech = false;
    let noiseFloor = 0.005;
    let waitingCandidateAt = 0;
    let lastResumeAt = localStorage.getItem(resumeKey) || "";
    let waitingMeterPending = false;

    function send(type, data) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
    }
    window.addEventListener("message", event => {
      if (event.data?.type !== "streamlit:render") return;
      settings = event.data.args || {};
      sessionId = settings.session_id || "";
      if (beginAck && settings.accepted_request_id === beginAck.id) {
        const pending = beginAck;
        beginAck = null;
        pending.resolve(true);
      }
      send("streamlit:setFrameHeight", {height: 92});
      if (phase === "waiting" && !stream) startWaitingMonitor();
    });
    send("streamlit:componentReady", {apiVersion: 1});
    send("streamlit:setFrameHeight", {height: 92});

    function show(next, message) {
      phase = next;
      const visualPhase = {
        idle: "idle", permission: "idle", listening: "listening",
        processing: "transcribing", waiting: "retrieving", error: "error"
      }[next] || "idle";
      try {
        localStorage.setItem("texmin_ai_activity", JSON.stringify({
          phase: visualPhase,
          label: visualPhase === "idle" ? "Ready" : visualPhase[0].toUpperCase() + visualPhase.slice(1),
          at: Date.now()
        }));
      } catch (_) {}
      button.classList.toggle("listening", next === "listening");
      button.classList.toggle("waiting", next === "waiting");
      label.textContent = {
        idle: "Start conversation", permission: "Cancel microphone",
        listening: "Stop & transcribe", processing: "Cancel transcription",
        waiting: "Interrupt", error: "Try again"
      }[next] || "Start conversation";
      statusText.textContent = message;
      button.disabled = false;
    }
    function sendValue(value) {
      send("streamlit:setComponentValue", {value, dataType: "json"});
    }
    function waitForBeginAck(id) {
      return new Promise(resolve => {
        const timeout = setTimeout(() => {
          if (beginAck?.id === id) beginAck = null;
          resolve(false);
        }, 10000);
        beginAck = {id, resolve: accepted => {
          clearTimeout(timeout);
          resolve(accepted);
        }};
      });
    }
    function current(id) { return id === generation; }
    function interruptAudio() {
      ownInterruptAt = Date.now();
      localStorage.setItem(interruptKey, String(ownInterruptAt));
    }
    function stopCapture() {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      if (recorder && recorder.state !== "inactive") {
        recorder.onstop = null;
        recorder.ondataavailable = null;
        recorder.stop();
      }
      recorder = null;
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      if (context) context.close().catch(() => {});
      context = null;
      analyser = null;
      samples = null;
      chunks = [];
      painter.clearRect(0, 0, canvas.width, canvas.height);
    }
    function cancelCurrent(message = "Recording cancelled.") {
      generation++;
      if (beginAck) {
        const pending = beginAck;
        beginAck = null;
        pending.resolve(false);
      }
      if (requestId) sendValue({kind: "cancel", request_id: requestId});
      requestId = "";
      stopCapture();
      localStorage.removeItem(waitingKey);
      show("idle", message);
    }
    async function acquireMeter(id) {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        throw new Error("This browser cannot record microphone audio.");
      }
      const acquiredStream = await navigator.mediaDevices.getUserMedia({audio: {
        channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true
      }});
      if (!current(id)) {
        acquiredStream.getTracks().forEach(track => track.stop());
        return false;
      }
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const acquiredContext = new AudioContext();
      try {
        await acquiredContext.resume();
        if (!current(id)) {
          acquiredStream.getTracks().forEach(track => track.stop());
          await acquiredContext.close();
          return false;
        }
        const acquiredAnalyser = acquiredContext.createAnalyser();
        acquiredAnalyser.fftSize = 512;
        acquiredContext.createMediaStreamSource(acquiredStream).connect(acquiredAnalyser);
        stream = acquiredStream;
        context = acquiredContext;
        analyser = acquiredAnalyser;
        samples = new Uint8Array(analyser.fftSize);
        return true;
      } catch (error) {
        acquiredStream.getTracks().forEach(track => track.stop());
        acquiredContext.close().catch(() => {});
        throw error;
      }
    }
    function volume() {
      analyser.getByteTimeDomainData(samples);
      let squared = 0;
      for (const value of samples) {
        const amplitude = (value - 128) / 128;
        squared += amplitude * amplitude;
      }
      return Math.sqrt(squared / samples.length);
    }
    function draw(level) {
      painter.clearRect(0, 0, canvas.width, canvas.height);
      painter.fillStyle = "rgba(9,14,24,.54)";
      painter.fillRect(0, 0, canvas.width, canvas.height);
      painter.fillStyle = "rgba(82,214,180,.7)";
      for (let i = 0; i < 28; i++) {
        const height = Math.max(3, Math.min(70, 4 + level * 440 * (0.55 + Math.sin(i * 2.1) * 0.3)));
        painter.fillRect(i * 9.3, (76 - height) / 2, 6, height);
      }
    }
    function tick(id) {
      if (!current(id) || !analyser) return;
      const now = Date.now();
      const level = volume();
      draw(level);
      if (phase === "listening") {
        const threshold = Math.max(0.018, noiseFloor * 2.5 + 0.006);
        if (level > threshold) {
          if (!candidateAt) candidateAt = now;
          if (now - candidateAt >= (settings.speech_confirm_ms || 150)) {
            heardSpeech = true;
            lastSpeechAt = now;
            statusText.textContent = "Speech detected. Listening...";
          }
        } else {
          candidateAt = 0;
          if (!heardSpeech) noiseFloor = noiseFloor * 0.96 + level * 0.04;
        }
        if (!heardSpeech && now - startedAt > (settings.no_speech_timeout_seconds || 10) * 1000) {
          cancelCurrent("No speech detected. Please try again.");
          return;
        }
        if (heardSpeech && now - lastSpeechAt > (settings.silence_ms || 1100)) {
          finishRecording(id);
          return;
        }
        if (now - startedAt > (settings.max_recording_seconds || 30) * 1000) {
          finishRecording(id);
          return;
        }
      } else if (phase === "waiting") {
        const speaking = Date.now() - Number(localStorage.getItem(speakingKey) || 0) < 1800;
        const threshold = Math.max(speaking ? 0.09 : 0.045, noiseFloor * 3 + 0.02);
        if (level > threshold) {
          if (!waitingCandidateAt) waitingCandidateAt = now;
          if (now - waitingCandidateAt > 300) {
            stopCapture();
            startListening();
            return;
          }
        } else {
          waitingCandidateAt = 0;
          noiseFloor = noiseFloor * 0.98 + level * 0.02;
        }
      }
      raf = requestAnimationFrame(() => tick(id));
    }
    async function startListening() {
      if (!sessionId) { show("error", "Conversation is not ready. Please retry."); return; }
      if (phase === "listening" || phase === "permission" || phase === "processing") cancelCurrent();
      const id = ++generation;
      stopCapture();
      requestId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
      interruptAudio();
      localStorage.setItem(modeKey, "on");
      localStorage.removeItem(waitingKey);
      const acknowledged = waitForBeginAck(requestId);
      sendValue({kind: "begin", request_id: requestId});
      show("permission", "Preparing local microphone...");
      preview.textContent = "";
      try {
        if (!await acknowledged) {
          if (current(id)) cancelCurrent("Microphone setup timed out. Please retry.");
          return;
        }
        if (!current(id) || !await acquireMeter(id)) return;
        const choices = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/webm", "audio/mp4"];
        mime = choices.find(candidate => MediaRecorder.isTypeSupported(candidate)) || "";
        recorder = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
        mime = recorder.mimeType || mime;
        if (!["audio/webm", "audio/ogg", "audio/mp4"].includes(mime.split(";", 1)[0])) {
          throw new Error("This browser's recording format is not supported.");
        }
        chunks = [];
        recorder.ondataavailable = event => { if (current(id) && event.data?.size) chunks.push(event.data); };
        recorder.onerror = () => { if (current(id)) cancelCurrent("Microphone recording failed. Please retry."); };
        recorder.start(settings.recording_buffer_ms || 250);
        startedAt = Date.now();
        lastSpeechAt = 0;
        candidateAt = 0;
        heardSpeech = false;
        noiseFloor = 0.005;
        show("listening", "Listening... Tap to stop.");
        tick(id);
      } catch (error) {
        if (current(id)) cancelCurrent(error.name === "NotAllowedError"
          ? "Microphone permission denied." : (error.message || "Microphone could not start."));
      }
    }
    async function finishRecording(id) {
      if (!current(id) || phase !== "listening") return;
      show("processing", "Processing audio locally...");
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      const activeRecorder = recorder;
      if (!activeRecorder || activeRecorder.state === "inactive") {
        cancelCurrent("The recording stopped unexpectedly. Please retry.");
        return;
      }
      const stopped = new Promise(resolve => { activeRecorder.onstop = resolve; });
      activeRecorder.stop();
      await stopped;
      if (!current(id)) return;
      const blob = new Blob(chunks, {type: mime});
      stopCapture();
      if (!blob.size) { cancelCurrent("The recording was empty. Please retry."); return; }
      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("Microphone recording could not be read."));
          reader.readAsDataURL(blob);
        });
        if (!current(id)) return;
        show("waiting", "Transcribing and answering locally...");
        localStorage.setItem(waitingKey, String(Date.now()));
        sendValue({
          kind: "audio", request_id: requestId,
          audio_mime: mime, audio_b64: String(dataUrl).split(",", 2)[1] || ""
        });
        startWaitingMonitor();
      } catch (error) {
        if (current(id)) cancelCurrent(error.message || "Recording could not be sent.");
      }
    }
    async function startWaitingMonitor() {
      if (phase !== "waiting" || stream || waitingMeterPending) return;
      const id = generation;
      waitingMeterPending = true;
      try {
        if (!await acquireMeter(id)) return;
        if (phase !== "waiting") { stopCapture(); return; }
        waitingCandidateAt = 0;
        tick(id);
      } catch (_) {
        if (current(id)) statusText.textContent = "Tap Interrupt to ask another question.";
      } finally {
        waitingMeterPending = false;
      }
    }
    button.addEventListener("click", () => {
      if (phase === "listening") finishRecording(generation);
      else if (phase === "permission" || phase === "processing") cancelCurrent();
      else startListening();
    });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape" && ["permission", "listening", "processing", "waiting"].includes(phase)) {
        cancelCurrent("Voice interaction cancelled.");
      }
    });
    window.addEventListener("storage", event => {
      if (event.key === interruptKey && Number(event.newValue || 0) > ownInterruptAt && phase !== "idle") {
        cancelCurrent("Interrupted by a newer query.");
      }
    });
    setInterval(() => {
      const resumeAt = localStorage.getItem(resumeKey) || "";
      if (resumeAt && resumeAt !== lastResumeAt) {
        lastResumeAt = resumeAt;
        if (phase === "waiting") {
          stopCapture();
          startListening();
        }
      }
    }, 250);
    window.addEventListener("beforeunload", () => {
      stopCapture();
    });
    const waitingAt = Number(localStorage.getItem(waitingKey) || 0);
    if (localStorage.getItem(modeKey) === "on" && waitingAt && Date.now() - waitingAt < 300000) {
      show("waiting", "Speak or tap to interrupt.");
      if (sessionId) startWaitingMonitor();
    } else {
      show("idle", "Tap once and speak naturally.");
    }
  </script>
</body>
</html>
