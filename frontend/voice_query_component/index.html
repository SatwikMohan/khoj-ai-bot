<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      margin: 0;
      background: transparent;
      color: #f4f8f5;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      overflow: hidden;
    }

    .voice-query {
      border: 1px solid rgba(103, 245, 150, 0.24);
      border-radius: 12px;
      background: rgba(11, 17, 12, 0.85);
      padding: 10px;
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr);
      gap: 10px;
      align-items: center;
      box-sizing: border-box;
    }

    .mic-button {
      border: 1px solid rgba(103, 245, 150, 0.42);
      border-radius: 10px;
      background: rgba(103, 245, 150, 0.1);
      color: #b8ffcb;
      height: 38px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 760;
      cursor: pointer;
      white-space: nowrap;
    }

    .mic-button.listening {
      border-color: rgba(103, 245, 150, 0.72);
      background: rgba(103, 245, 150, 0.16);
      color: #e2ffea;
    }

    .mic-button.waiting {
      border-color: rgba(103, 245, 150, 0.55);
      background: rgba(103, 245, 150, 0.12);
      color: #b8ffcb;
    }

    .mic-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #70f69c;
      box-shadow: 0 0 0 4px rgba(103, 245, 150, 0.16);
    }

    .mic-button.listening .mic-dot {
      animation: pulse 1s ease-in-out infinite;
    }

    .voice-panel {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(90px, 1fr) minmax(140px, 1.8fr);
      gap: 10px;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 38px;
      border-radius: 8px;
      background: rgba(5, 10, 6, 0.8);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .voice-status {
      color: #9caea1;
      font-size: 0.75rem;
      line-height: 1.25;
      white-space: normal;
    }

    .voice-preview {
      color: #f4f8f5;
      font-size: 0.78rem;
      line-height: 1.3;
      min-height: 1.3em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }

    @media (max-width: 560px) {
      .voice-query {
        grid-template-columns: auto minmax(0, 1fr);
        padding: 7px;
        gap: 8px;
      }
      .voice-panel { grid-template-columns: minmax(0, 1fr); }
      .voice-panel canvas { display: none; }
      .mic-button { padding: 0 9px; font-size: 0.77rem; }
    }
  </style>
</head>
<body>
  <div class="voice-query">
    <button class="mic-button" id="micButton" type="button" aria-label="Start conversation">
      <span class="mic-dot"></span>
      <span id="micLabel">Start conversation</span>
    </button>
    <div class="voice-panel">
      <canvas id="waveCanvas" width="260" height="76" aria-label="Input volume waves"></canvas>
      <div>
        <div class="voice-status" id="voiceStatus">Tap once and speak naturally.</div>
        <div class="voice-preview" id="voicePreview"></div>
      </div>
    </div>
  </div>

  <script>
    const button = document.getElementById("micButton");
    const label = document.getElementById("micLabel");
    const statusText = document.getElementById("voiceStatus");
    const preview = document.getElementById("voicePreview");
    const canvas = document.getElementById("waveCanvas");
    const painter = canvas.getContext("2d");
    const interruptKey = "texmin_voice_interrupt_at";
    let settings = {}, sessionId = "", phase = "IDLE", generation = 0;
    let requestId = "", stream = null, recorder = null, chunks = [];
    let context = null, analyser = null, samples = null, timer = 0;
    let startedAt = 0, speechAt = 0, noiseFloor = 0.005, beginAck = null;
    let ownInterruptAt = 0;

    function send(type, data) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
    }
    function sendValue(value) {
      send("streamlit:setComponentValue", {value, dataType: "json"});
    }
    function show(next, message) {
      phase = next;
      label.textContent = ({
        IDLE:"Record question", REQUESTING_PERMISSION:"Cancel", READY:"Record question",
        RECORDING:"Stop recording", PROCESSING_AUDIO:"Cancel", TRANSCRIBING:"Cancel",
        TRANSCRIPT_REVIEW:"Record again", PERMISSION_DENIED:"Retry microphone",
        NO_DEVICE:"Retry microphone", NO_AUDIO:"Record again",
        TRANSCRIPTION_FAILED:"Record again", CANCELLED:"Record question"
      })[next] || "Record question";
      button.setAttribute("aria-label", label.textContent);
      button.classList.toggle("listening", next === "RECORDING");
      button.classList.toggle("waiting", next === "TRANSCRIBING" || next === "PROCESSING_AUDIO");
      statusText.textContent = message;
      try {
        localStorage.setItem("texmin_ai_activity", JSON.stringify({
          phase: next === "RECORDING" ? "listening" : next === "TRANSCRIBING" ? "transcribing" : "idle",
          label: next, at: Date.now()
        }));
      } catch (_) {}
    }
    function stopCapture() {
      if (timer) clearInterval(timer);
      timer = 0;
      if (recorder && recorder.state !== "inactive") {
        recorder.onstop = null;
        recorder.ondataavailable = null;
        recorder.stop();
      }
      recorder = null;
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      if (context) context.close().catch(() => {});
      context = null; analyser = null; samples = null; chunks = [];
      painter.clearRect(0, 0, canvas.width, canvas.height);
    }
    function cancel(message = "Recording cancelled.", state = "CANCELLED") {
      generation++;
      if (beginAck) { beginAck.resolve(false); beginAck = null; }
      if (requestId) sendValue({kind:"cancel", request_id:requestId});
      requestId = "";
      stopCapture();
      show(state, message);
    }
    function waitForAck(id) {
      return new Promise(resolve => {
        const timeout = setTimeout(() => {
          if (beginAck?.id === id) beginAck = null;
          resolve(false);
        }, 10000);
        beginAck = {id, resolve: value => {clearTimeout(timeout); resolve(value);}};
      });
    }
    window.addEventListener("message", event => {
      if (event.data?.type !== "streamlit:render") return;
      settings = event.data.args || {};
      sessionId = settings.session_id || "";
      if (beginAck && settings.accepted_request_id === beginAck.id) {
        const pending = beginAck; beginAck = null; pending.resolve(true);
      }
      if (settings.review_request_id && settings.review_request_id === requestId) {
        requestId = "";
        show("TRANSCRIPT_REVIEW", "Transcript ready below. Review or edit it.");
      } else if (settings.voice_error_request_id === requestId) {
        requestId = "";
        show("TRANSCRIPTION_FAILED", settings.voice_error || "Transcription failed. Record again.");
      }
      send("streamlit:setFrameHeight", {height: 120});
    });
    send("streamlit:componentReady", {apiVersion: 1});
    send("streamlit:setFrameHeight", {height: 120});

    function meterTick(id) {
      if (id !== generation || phase !== "RECORDING" || !analyser) return;
      analyser.getByteTimeDomainData(samples);
      let squared = 0;
      for (const value of samples) squared += ((value - 128) / 128) ** 2;
      const level = Math.sqrt(squared / samples.length);
      const now = Date.now();
      painter.clearRect(0, 0, canvas.width, canvas.height);
      painter.fillStyle = "rgba(82,214,180,.7)";
      for (let i = 0; i < 28; i++) {
        const height = Math.max(3, Math.min(70, 4 + level * 450));
        painter.fillRect(i * 9.3, (76 - height) / 2, 6, height);
      }
      if (level > Math.max(0.018, noiseFloor * 2.5 + 0.006)) speechAt = now;
      else if (!speechAt) noiseFloor = noiseFloor * 0.96 + level * 0.04;
      statusText.textContent = `Recording ${Math.floor((now - startedAt) / 1000)}s. Tap to stop.`;
      if (!speechAt && now - startedAt >= (settings.no_speech_timeout_seconds || 10) * 1000) {
        cancel("No speech detected. Check the input device and try again.", "NO_AUDIO");
      } else if (now - startedAt >= (settings.max_recording_seconds || 30) * 1000) {
        finishRecording(id);
      }
    }
    async function beginRecording() {
      if (!sessionId) {show("TRANSCRIPTION_FAILED", "Conversation is not ready. Retry."); return;}
      if (!window.isSecureContext) {
        show("PERMISSION_DENIED", "Microphone access requires HTTPS or localhost. Open the secure app URL.");
        return;
      }
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        show("NO_DEVICE", "This browser cannot record audio. Use a current browser.");
        return;
      }
      const id = ++generation;
      stopCapture();
      requestId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
      ownInterruptAt = Date.now();
      localStorage.setItem(interruptKey, String(ownInterruptAt));
      const acknowledged = waitForAck(requestId);
      sendValue({kind:"begin", request_id:requestId});
      show("REQUESTING_PERMISSION", "Requesting microphone permission...");
      try {
        if (!await acknowledged) {
          if (id === generation) cancel("Microphone setup timed out. Retry.", "TRANSCRIPTION_FAILED");
          return;
        }
        if (id !== generation) return;
        const acquired = await navigator.mediaDevices.getUserMedia({audio:{
          channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true
        }});
        if (id !== generation) {acquired.getTracks().forEach(track => track.stop()); return;}
        stream = acquired;
        const track = stream.getAudioTracks()[0];
        if (!track) throw new DOMException("No audio input track", "NotFoundError");
        track.onended = () => {
          if (id === generation && phase === "RECORDING")
            cancel("Microphone disconnected. Reconnect it and retry.", "NO_DEVICE");
        };
        preview.textContent = track.label ? `Input: ${track.label}` : "Microphone input ready";
        const audioContext = window.AudioContext || window.webkitAudioContext;
        context = new audioContext();
        await context.resume();
        analyser = context.createAnalyser();
        analyser.fftSize = 512;
        context.createMediaStreamSource(stream).connect(analyser);
        samples = new Uint8Array(analyser.fftSize);
        const choices = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/webm", "audio/mp4"];
        const mime = choices.find(type => MediaRecorder.isTypeSupported(type));
        recorder = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
        if (!["audio/webm", "audio/ogg", "audio/mp4"].includes(recorder.mimeType.split(";")[0])) {
          throw new Error("This browser's recording format is unsupported.");
        }
        chunks = [];
        recorder.ondataavailable = event => {if (id === generation && event.data?.size) chunks.push(event.data);};
        recorder.onerror = () => {if (id === generation) cancel("Recording failed. Retry.", "NO_AUDIO");};
        recorder.start(settings.recording_buffer_ms || 250);
        startedAt = Date.now(); speechAt = 0; noiseFloor = 0.005;
        show("RECORDING", "Recording 0s. Tap to stop.");
        timer = setInterval(() => meterTick(id), 100);
      } catch (error) {
        if (id !== generation) return;
        const denied = error.name === "NotAllowedError" || error.name === "SecurityError";
        const missing = error.name === "NotFoundError" || error.name === "OverconstrainedError";
        cancel(denied ? "Permission denied. Allow this site in browser settings, then retry."
          : missing ? "No microphone found. Connect one and check system permissions."
          : error.message || "Microphone capture failed. Retry.",
          denied ? "PERMISSION_DENIED" : missing ? "NO_DEVICE" : "NO_AUDIO");
      }
    }
    async function finishRecording(id) {
      if (id !== generation || phase !== "RECORDING") return;
      show("PROCESSING_AUDIO", "Preparing recording...");
      if (timer) clearInterval(timer);
      timer = 0;
      const active = recorder;
      if (!active || active.state === "inactive") {
        cancel("Recording stopped unexpectedly. Retry.", "NO_AUDIO"); return;
      }
      const stopped = new Promise(resolve => {active.onstop = resolve;});
      active.stop();
      await stopped;
      if (id !== generation) return;
      const duration = (Date.now() - startedAt) / 1000;
      const blob = new Blob(chunks, {type:active.mimeType});
      stopCapture();
      if (!blob.size || duration < 0.35 || !speechAt) {
        cancel("No usable speech was recorded. Speak closer and retry.", "NO_AUDIO"); return;
      }
      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("Recording could not be read."));
          reader.readAsDataURL(blob);
        });
        if (id !== generation) return;
        show("TRANSCRIBING", "Transcribing locally. You can cancel and retry.");
        sendValue({kind:"audio", request_id:requestId, audio_mime:active.mimeType,
          audio_b64:String(dataUrl).split(",")[1] || "", duration_seconds:duration});
      } catch (error) {
        if (id === generation) cancel(error.message, "NO_AUDIO");
      }
    }
    button.addEventListener("click", () => {
      if (phase === "RECORDING") finishRecording(generation);
      else if (["REQUESTING_PERMISSION", "PROCESSING_AUDIO", "TRANSCRIBING"].includes(phase)) cancel();
      else beginRecording();
    });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape" && ["REQUESTING_PERMISSION", "RECORDING", "PROCESSING_AUDIO", "TRANSCRIBING"].includes(phase)) cancel();
    });
    window.addEventListener("storage", event => {
      if (event.key === interruptKey && Number(event.newValue || 0) > ownInterruptAt &&
          ["REQUESTING_PERMISSION", "RECORDING", "PROCESSING_AUDIO", "TRANSCRIBING"].includes(phase)) {
        cancel("Interrupted by a newer query.");
      }
    });
    window.addEventListener("beforeunload", stopCapture);
    show("IDLE", "Tap to record with this browser's microphone.");
  </script>
</body>
</html>
