<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      margin: 0;
      background: transparent;
      color: #f4f8f5;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      overflow: hidden;
    }

    .voice-query {
      border: 1px solid rgba(103, 245, 150, 0.24);
      border-radius: 12px;
      background: rgba(11, 17, 12, 0.85);
      padding: 10px;
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr);
      gap: 10px;
      align-items: center;
      box-sizing: border-box;
    }

    .mic-button {
      border: 1px solid rgba(103, 245, 150, 0.42);
      border-radius: 10px;
      background: rgba(103, 245, 150, 0.1);
      color: #b8ffcb;
      height: 38px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 760;
      cursor: pointer;
      white-space: nowrap;
    }

    .mic-button.listening {
      border-color: rgba(103, 245, 150, 0.72);
      background: rgba(103, 245, 150, 0.16);
      color: #e2ffea;
    }

    .mic-button.waiting {
      border-color: rgba(103, 245, 150, 0.55);
      background: rgba(103, 245, 150, 0.12);
      color: #b8ffcb;
    }

    .mic-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #70f69c;
      box-shadow: 0 0 0 4px rgba(103, 245, 150, 0.16);
    }

    .mic-button.listening .mic-dot {
      animation: pulse 1s ease-in-out infinite;
    }

    .voice-panel {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(90px, 1fr) minmax(140px, 1.8fr);
      gap: 10px;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 38px;
      border-radius: 8px;
      background: rgba(5, 10, 6, 0.8);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .voice-status {
      color: #9caea1;
      font-size: 0.75rem;
      line-height: 1.25;
      white-space: normal;
    }

    .voice-preview {
      color: #f4f8f5;
      font-size: 0.78rem;
      line-height: 1.3;
      min-height: 1.3em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }

    @media (max-width: 560px) {
      .voice-query {
        grid-template-columns: auto minmax(0, 1fr);
        padding: 7px;
        gap: 8px;
      }
      .voice-panel { grid-template-columns: minmax(0, 1fr); }
      .voice-panel canvas { display: none; }
      .mic-button { padding: 0 9px; font-size: 0.77rem; }
    }
  </style>
</head>
<body>
  <div class="voice-query">
    <button class="mic-button" id="micButton" type="button" aria-label="Start conversation">
      <span class="mic-dot"></span>
      <span id="micLabel">Start conversation</span>
    </button>
    <div class="voice-panel">
      <canvas id="waveCanvas" width="260" height="76" aria-label="Input volume waves"></canvas>
      <div>
        <div class="voice-status" id="voiceStatus">Tap once and speak naturally.</div>
        <div class="voice-preview" id="voicePreview"></div>
      </div>
    </div>
  </div>

  <script>
    const button = document.getElementById("micButton");
    const label = document.getElementById("micLabel");
    const statusText = document.getElementById("voiceStatus");
    const preview = document.getElementById("voicePreview");
    const canvas = document.getElementById("waveCanvas");
    const painter = canvas.getContext("2d");
    const interruptKey = "texmin_voice_interrupt_at";
    let settings = {}, sessionId = "", phase = "IDLE", generation = 0;
    let requestId = "", stream = null, recorder = null, chunks = [];
    let context = null, analyser = null, samples = null, timer = 0;
    let startedAt = 0, speechAt = 0, speechCandidateAt = 0, lastSpeechAt = 0;
    let noiseFloor = 0.005, beginAck = null, enabled = false, restoredSession = "";
    let ownInterruptAt = 0, resumedRequestId = "";

    function send(type, data) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
    }
    function sendValue(value) {
      send("streamlit:setComponentValue", {value, dataType: "json"});
    }
    function modeKey() {return "texmin_voice_enabled:" + sessionId;}
    function turnKey() {return "texmin_voice_turn:" + sessionId;}
    function audioKey() {return "texmin_voice_audio_state:" + sessionId;}
    function readState(key) {
      try {return JSON.parse(localStorage.getItem(key) || "null");} catch (_) {return null;}
    }
    function writeTurn(state) {
      if (sessionId) localStorage.setItem(turnKey(), JSON.stringify({
        requestId, state, at: Date.now()
      }));
    }
    function show(next, message) {
      phase = next;
      label.textContent = enabled ? "End conversation" : "Start conversation";
      button.setAttribute("aria-label", label.textContent);
      button.classList.toggle("listening", next === "LISTENING" || next === "RECORDING");
      button.classList.toggle("waiting", ["TRANSCRIBING", "THINKING", "SPEAKING"].includes(next));
      statusText.textContent = message;
      if (["LISTENING", "RECORDING", "TRANSCRIBING", "IDLE"].includes(next)) {
        try {
          localStorage.setItem("texmin_ai_activity", JSON.stringify({
            phase: next === "LISTENING" || next === "RECORDING" ? "listening" :
              next === "TRANSCRIBING" ? "transcribing" : "idle",
            label: message, at: Date.now()
          }));
        } catch (_) {}
      }
    }
    function stopCapture() {
      if (timer) clearInterval(timer);
      timer = 0;
      if (recorder && recorder.state !== "inactive") {
        recorder.onstop = null;
        recorder.ondataavailable = null;
        recorder.stop();
      }
      recorder = null;
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      if (context) context.close().catch(() => {});
      context = null; analyser = null; samples = null; chunks = [];
      painter.clearRect(0, 0, canvas.width, canvas.height);
    }
    function cancel(message = "Conversation ended.", state = "IDLE",
                    notifyServer = true, interruptPlayback = true) {
      generation++;
      enabled = false;
      if (sessionId) localStorage.removeItem(modeKey());
      if (beginAck) { beginAck.resolve(false); beginAck = null; }
      if (notifyServer && requestId) sendValue({kind:"cancel", request_id:requestId});
      if (interruptPlayback) {
        ownInterruptAt = Date.now();
        localStorage.setItem(interruptKey, String(ownInterruptAt));
      }
      requestId = "";
      if (sessionId) localStorage.removeItem(turnKey());
      stopCapture();
      show(state, message);
    }
    function syncTurn() {
      if (!enabled || !sessionId) return;
      const turn = readState(turnKey());
      if (!turn || !turn.requestId) {
        if (phase === "THINKING") beginRecording();
        return;
      }
      if (!["listening", "recording"].includes(turn.state) &&
          Date.now() - Number(turn.at || 0) > (settings.voice_turn_watchdog_seconds || 900) * 1000) {
        cancel("Voice turn stalled. Start the conversation again.", "TRANSCRIPTION_FAILED");
        return;
      }
      if (turn.state === "requesting" || turn.state === "listening" || turn.state === "recording") {
        if (settings.accepted_request_id === turn.requestId &&
            !["REQUESTING_PERMISSION", "LISTENING", "RECORDING"].includes(phase)) {
          beginRecording(turn.requestId);
        }
        return;
      }
      if (turn.requestId !== requestId) requestId = turn.requestId;
      if (turn.state === "transcribing" || turn.state === "submitted") {
        const playback = readState(audioKey());
        if (playback?.requestId === turn.requestId && playback.state === "playing") {
          show("SPEAKING", "Speaking the answer...");
          return;
        }
        if (phase !== "TRANSCRIBING" && phase !== "THINKING")
          show(turn.state === "transcribing" ? "TRANSCRIBING" : "THINKING",
               turn.state === "transcribing" ? "Recognizing speech..." : "Preparing the answer...");
        const activity = readState("texmin_ai_activity");
        if (activity && Date.now() - activity.at < 120000 &&
            ["retrieving", "generating", "synthesizing"].includes(activity.phase)) {
          phase = "THINKING";
          statusText.textContent = activity.label;
        }
        return;
      }
      if (turn.state === "cancelled") {
        cancel("Answer interrupted. Start a new conversation.", "CANCELLED", false, false);
        return;
      }
      if (turn.state !== "finished" || turn.requestId === resumedRequestId) return;
      const audio = readState(audioKey());
      if (turn.awaitAudio && (!audio || audio.requestId !== turn.requestId ||
          !["completed", "stopped"].includes(audio.state))) {
        const message = audio?.state === "playing" ? "Speaking the answer..." :
          "Waiting for spoken answer...";
        const next = audio?.state === "playing" ? "SPEAKING" : "THINKING";
        if (phase !== next || statusText.textContent !== message)
          show(next, message);
        return;
      }
      resumedRequestId = turn.requestId;
      console.info(JSON.stringify({event:"voice_listening_resumed", request_id:turn.requestId,
        elapsed_after_answer_ms:Date.now() - turn.at}));
      requestId = "";
      beginRecording();
    }
    function waitForAck(id) {
      return new Promise(resolve => {
        const timeout = setTimeout(() => {
          if (beginAck?.id === id) beginAck = null;
          resolve(false);
        }, 10000);
        beginAck = {id, resolve: value => {clearTimeout(timeout); resolve(value);}};
      });
    }
    window.addEventListener("message", event => {
      if (event.data?.type !== "streamlit:render") return;
      settings = event.data.args || {};
      sessionId = settings.session_id || "";
      if (sessionId && restoredSession !== sessionId) {
        restoredSession = sessionId;
        enabled = localStorage.getItem(modeKey()) === "true";
        if (enabled) show("THINKING", "Restoring conversation...");
      }
      if (beginAck && settings.accepted_request_id === beginAck.id) {
        const pending = beginAck; beginAck = null; pending.resolve(true);
      }
      if (settings.voice_error_request_id === requestId) {
        cancel(settings.voice_error || "Transcription failed. Check the microphone and retry.",
               "TRANSCRIPTION_FAILED", false, false);
      } else syncTurn();
      send("streamlit:setFrameHeight", {height: 120});
    });
    send("streamlit:componentReady", {apiVersion: 1});
    send("streamlit:setFrameHeight", {height: 120});

    function meterTick(id) {
      if (id !== generation || !["LISTENING", "RECORDING"].includes(phase) || !analyser) return;
      analyser.getByteTimeDomainData(samples);
      let squared = 0;
      for (const value of samples) squared += ((value - 128) / 128) ** 2;
      const level = Math.sqrt(squared / samples.length);
      const now = Date.now();
      painter.clearRect(0, 0, canvas.width, canvas.height);
      painter.fillStyle = "rgba(82,214,180,.7)";
      for (let i = 0; i < 28; i++) {
        const height = Math.max(3, Math.min(70, 4 + level * 450));
        painter.fillRect(i * 9.3, (76 - height) / 2, 6, height);
      }
      const active = level > Math.max(0.018, noiseFloor * 2.5 + 0.006);
      if (active) {
        if (!speechCandidateAt) speechCandidateAt = now;
        if (speechAt || now - speechCandidateAt >= (settings.speech_confirm_ms || 150)) {
          if (!speechAt) {
            speechAt = now;
            show("RECORDING", "Speech detected. Listening until you finish...");
            writeTurn("recording");
            console.info(JSON.stringify({event:"voice_first_speech",request_id:requestId,
              elapsed_from_listening_ms:now - startedAt}));
          }
          lastSpeechAt = now;
        }
      } else {
        speechCandidateAt = 0;
        if (!speechAt) noiseFloor = noiseFloor * 0.96 + level * 0.04;
      }
      if (speechAt && now - lastSpeechAt >= (settings.silence_ms || 1100)) {
        console.info(JSON.stringify({event:"voice_utterance_ended",request_id:requestId,
          silence_ms:now - lastSpeechAt}));
        finishRecording(id);
      } else if (speechAt && now - startedAt >= (settings.max_recording_seconds || 30) * 1000) {
        finishRecording(id);
      } else if (!speechAt && now - startedAt >= Math.min(
          settings.no_speech_timeout_seconds || 10,
          settings.max_recording_seconds || 30) * 1000) {
        // Start a fresh container; never discard its header or intermediate packets.
        beginRecording(requestId);
      }
    }
    async function beginRecording(reuseId = "") {
      if (!enabled || !sessionId) {cancel("Conversation is not ready. Retry.", "TRANSCRIPTION_FAILED"); return;}
      if (!window.isSecureContext) {
        cancel("Microphone access requires HTTPS or localhost. Open the secure app URL.", "PERMISSION_DENIED");
        return;
      }
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        cancel("This browser cannot record audio. Use a current browser.", "NO_DEVICE");
        return;
      }
      const id = ++generation;
      stopCapture();
      requestId = reuseId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
      const acknowledged = reuseId ? Promise.resolve(true) : waitForAck(requestId);
      if (!reuseId) {
        ownInterruptAt = Date.now();
        localStorage.setItem(interruptKey, String(ownInterruptAt));
        writeTurn("requesting");
        sendValue({kind:"begin", request_id:requestId});
      }
      show("REQUESTING_PERMISSION", "Requesting microphone permission...");
      try {
        if (!await acknowledged) {
          if (id === generation) cancel("Microphone setup timed out. Retry.", "TRANSCRIPTION_FAILED");
          return;
        }
        if (id !== generation) return;
        const acquired = await navigator.mediaDevices.getUserMedia({audio:{
          channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true
        }});
        if (id !== generation) {acquired.getTracks().forEach(track => track.stop()); return;}
        stream = acquired;
        const track = stream.getAudioTracks()[0];
        if (!track) throw new DOMException("No audio input track", "NotFoundError");
        track.onended = () => {
          if (id === generation && ["LISTENING", "RECORDING"].includes(phase))
            cancel("Microphone disconnected. Reconnect it and retry.", "NO_DEVICE");
        };
        preview.textContent = track.label ? `Input: ${track.label}` : "Microphone input ready";
        const audioContext = window.AudioContext || window.webkitAudioContext;
        context = new audioContext();
        await context.resume();
        analyser = context.createAnalyser();
        analyser.fftSize = 512;
        context.createMediaStreamSource(stream).connect(analyser);
        samples = new Uint8Array(analyser.fftSize);
        const choices = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/webm", "audio/mp4"];
        const mime = choices.find(type => MediaRecorder.isTypeSupported(type));
        recorder = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
        if (!["audio/webm", "audio/ogg", "audio/mp4"].includes(recorder.mimeType.split(";")[0])) {
          throw new Error("This browser's recording format is unsupported.");
        }
        chunks = [];
        recorder.ondataavailable = event => {
          if (id !== generation || !event.data?.size) return;
          chunks.push(event.data);
        };
        recorder.onerror = () => {if (id === generation) cancel("Recording failed. Retry.", "NO_AUDIO");};
        recorder.start(settings.recording_buffer_ms || 250);
        startedAt = Date.now(); speechAt = 0; speechCandidateAt = 0;
        lastSpeechAt = 0; noiseFloor = 0.005;
        show("LISTENING", "Listening for your question...");
        writeTurn("listening");
        console.info(JSON.stringify({event:"voice_listening_started",request_id:requestId}));
        timer = setInterval(() => meterTick(id), 100);
      } catch (error) {
        if (id !== generation) return;
        const denied = error.name === "NotAllowedError" || error.name === "SecurityError";
        const missing = error.name === "NotFoundError" || error.name === "OverconstrainedError";
        cancel(denied ? "Permission denied. Allow this site in browser settings, then retry."
          : missing ? "No microphone found. Connect one and check system permissions."
          : error.message || "Microphone capture failed. Retry.",
          denied ? "PERMISSION_DENIED" : missing ? "NO_DEVICE" : "NO_AUDIO");
      }
    }
    async function finishRecording(id) {
      if (id !== generation || phase !== "RECORDING") return;
      show("PROCESSING_AUDIO", "Preparing recording...");
      if (timer) clearInterval(timer);
      timer = 0;
      const active = recorder;
      if (!active || active.state === "inactive") {
        cancel("Recording stopped unexpectedly. Retry.", "NO_AUDIO"); return;
      }
      const stopped = new Promise(resolve => {active.onstop = resolve;});
      active.stop();
      await stopped;
      if (id !== generation) return;
      const duration = speechAt ? (Date.now() - speechAt) / 1000 : 0;
      const blob = new Blob(chunks, {type:active.mimeType});
      stopCapture();
      if (!blob.size || duration < 0.35 || !speechAt) {
        // The next begin supersedes this request; keep the voice session active.
        requestId = "";
        beginRecording();
        return;
      }
      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("Recording could not be read."));
          reader.readAsDataURL(blob);
        });
        if (id !== generation) return;
        show("TRANSCRIBING", "Recognizing speech...");
        writeTurn("transcribing");
        console.info(JSON.stringify({event:"voice_transcript_requested",request_id:requestId,
          audio_duration_s:Math.round(duration * 1000) / 1000}));
        sendValue({kind:"audio", request_id:requestId, audio_mime:active.mimeType,
          audio_b64:String(dataUrl).split(",")[1] || "", duration_seconds:duration});
      } catch (error) {
        if (id === generation) cancel(error.message, "NO_AUDIO");
      }
    }
    button.addEventListener("click", () => {
      if (enabled) cancel();
      else {
        enabled = true;
        localStorage.setItem(modeKey(), "true");
        beginRecording();
      }
    });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape" && enabled) cancel();
    });
    window.addEventListener("storage", event => {
      if (event.key === interruptKey && Number(event.newValue || 0) > ownInterruptAt && enabled) {
        cancel("Interrupted by a newer query.", "CANCELLED", false, false);
      } else if (event.key === turnKey() || event.key === audioKey()) syncTurn();
    });
    window.setInterval(syncTurn, 250);
    window.addEventListener("beforeunload", stopCapture);
    show("IDLE", "Start once, then speak naturally.");
  </script>
</body>
</html>
