<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      margin: 0;
      background: transparent;
      color: #edf3ff;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      overflow: hidden;
    }

    .voice-query {
      border: 1px solid rgba(82, 214, 180, 0.24);
      border-radius: 12px;
      background: rgba(16, 24, 39, 0.7);
      padding: 10px;
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr);
      gap: 10px;
      align-items: center;
      box-sizing: border-box;
    }

    .mic-button {
      border: 1px solid rgba(82, 214, 180, 0.42);
      border-radius: 10px;
      background: rgba(82, 214, 180, 0.1);
      color: #b7ffeb;
      height: 38px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 760;
      cursor: pointer;
      white-space: nowrap;
    }

    .mic-button.listening {
      border-color: rgba(82, 214, 180, 0.72);
      background: rgba(82, 214, 180, 0.16);
      color: #d8fff4;
    }

    .mic-button.waiting {
      border-color: rgba(255, 214, 128, 0.55);
      background: rgba(255, 214, 128, 0.12);
      color: #ffe1a8;
    }

    .mic-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #52d6b4;
      box-shadow: 0 0 0 4px rgba(82, 214, 180, 0.16);
    }

    .mic-button.listening .mic-dot {
      animation: pulse 1s ease-in-out infinite;
    }

    .voice-panel {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(90px, 1fr) minmax(140px, 1.8fr);
      gap: 10px;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 38px;
      border-radius: 8px;
      background: rgba(9, 14, 24, 0.54);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .voice-status {
      color: #9fb0c7;
      font-size: 0.75rem;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .voice-preview {
      color: #edf3ff;
      font-size: 0.78rem;
      line-height: 1.3;
      min-height: 1.3em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }

    @media (max-width: 560px) {
      .voice-query,
      .voice-panel {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="voice-query">
    <button class="mic-button" id="micButton" type="button" aria-label="Start conversation">
      <span class="mic-dot"></span>
      <span id="micLabel">Start conversation</span>
    </button>
    <div class="voice-panel">
      <canvas id="waveCanvas" width="260" height="76" aria-label="Input volume waves"></canvas>
      <div>
        <div class="voice-status" id="voiceStatus">Tap once and speak naturally.</div>
        <div class="voice-preview" id="voicePreview"></div>
      </div>
    </div>
  </div>

  <script>
    const button = document.getElementById("micButton");
    const label = document.getElementById("micLabel");
    const statusText = document.getElementById("voiceStatus");
    const preview = document.getElementById("voicePreview");
    const canvas = document.getElementById("waveCanvas");
    const canvasContext = canvas.getContext("2d");
    // Final transcription is always performed by the private DGX service. Keeping the
    // browser recognizer disabled prevents Chrome/Edge from sending microphone audio to a vendor.
    const SpeechRecognition = null;
    const storageModeKey = "texmin_voice_conversation";
    const storageResumeKey = "texmin_voice_resume_at";
    const storageWaitingKey = "texmin_voice_waiting_since";
    const storageInterruptKey = "texmin_voice_interrupt_at";
    const storageAvatarSpeakingKey = "texmin_voice_avatar_speaking_at";
    const storageInputSuppressedUntilKey = "texmin_voice_input_suppressed_until";
    const noTranscriptSilenceLimitMs = 700;
    const transcriptSilenceLimitMs = 850;
    const finalTranscriptSilenceLimitMs = 520;
    const continuedSpeechThreshold = 0.055;
    const calibrationDurationMs = 700;
    const speechConfirmationMs = 180;
    const resumeDelayMs = 40;
    const resumePollMs = 120;
    const waitingFreshMs = 300000;
    const voiceThreshold = 0.04;
    const waitingVoiceThreshold = 0.065;
    const interruptVoiceThreshold = 0.09;
    const interruptHoldMs = 260;

    let recognition = null;
    let listening = false;
    let mediaStream = null;
    let audioContext = null;
    let analyser = null;
    let waveData = null;
    let animationId = null;
    let finalTranscript = "";
    let interimTranscript = "";
    let latestTranscript = "";
    let heardSpeech = false;
    let lastVoiceAt = 0;
    let lastTranscriptAt = 0;
    let lastResumeAt = localStorage.getItem(storageResumeKey) || "";
    let interruptVoiceStartedAt = 0;
    let interruptPending = false;
    let interruptArmed = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingMime = "audio/webm";
    let submissionPending = false;
    let calibrationStartedAt = 0;
    let calibrationSamples = [];
    let noiseFloor = 0.008;
    let speechCandidateAt = 0;

    function percentile(values, ratio) {
      if (!values.length) return 0;
      const sorted = [...values].sort((left, right) => left - right);
      return sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * ratio))];
    }

    function calibrating(now = Date.now()) {
      return calibrationStartedAt > 0 && now - calibrationStartedAt < calibrationDurationMs;
    }

    function updateNoiseFloor(volume, now) {
      if (calibrating(now)) {
        calibrationSamples.push(volume);
        if (calibrationSamples.length > 80) calibrationSamples.shift();
        noiseFloor = Math.max(0.004, percentile(calibrationSamples, 0.35));
        return;
      }

      const speechThreshold = Math.max(voiceThreshold, noiseFloor * 2.6 + 0.012);
      if (!heardSpeech && volume < speechThreshold * 0.82) {
        noiseFloor = noiseFloor * 0.96 + volume * 0.04;
      }
    }

    function activeVoiceThreshold(waiting = false, speaking = false) {
      const adaptive = noiseFloor * (waiting ? 3.2 : 2.6) + (waiting ? 0.02 : 0.012);
      const minimum = speaking
        ? interruptVoiceThreshold
        : waiting
          ? waitingVoiceThreshold
          : voiceThreshold;
      return Math.max(minimum, adaptive);
    }

    function sendStreamlitMessage(type, data) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }

    function setFrameHeight() {
      sendStreamlitMessage("streamlit:setFrameHeight", { height: 92 });
    }

    function setComponentReady() {
      sendStreamlitMessage("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight();
    }

    function setComponentValue(value) {
      sendStreamlitMessage("streamlit:setComponentValue", {
        value,
        dataType: "json",
      });
    }

    function drawIdleWave() {
      const width = canvas.width;
      const height = canvas.height;
      canvasContext.clearRect(0, 0, width, height);
      canvasContext.fillStyle = "rgba(9, 14, 24, 0.45)";
      canvasContext.fillRect(0, 0, width, height);
      const bars = 28;
      const gap = 3;
      const barWidth = (width - gap * (bars - 1)) / bars;
      for (let index = 0; index < bars; index += 1) {
        const phase = index / bars;
        const barHeight = 5 + Math.sin(phase * Math.PI) * 10;
        const x = index * (barWidth + gap);
        const y = (height - barHeight) / 2;
        canvasContext.fillStyle = "rgba(82, 214, 180, 0.22)";
        canvasContext.fillRect(x, y, barWidth, barHeight);
      }
    }

    function setButtonState(state) {
      button.classList.toggle("listening", state === "listening");
      button.classList.toggle("waiting", state === "waiting");
      if (state === "listening") {
        label.textContent = "Listening";
      } else if (state === "waiting") {
        label.textContent = "Interrupt";
      } else {
        label.textContent = localStorage.getItem(storageModeKey) === "on"
          ? "Resume conversation"
          : "Start conversation";
      }
    }

    function isWaitingForAssistant() {
      return localStorage.getItem(storageModeKey) === "on"
        && Boolean(localStorage.getItem(storageWaitingKey));
    }

    function assistantIsSpeaking() {
      const speakingAt = Number(localStorage.getItem(storageAvatarSpeakingKey) || 0);
      return speakingAt > 0 && Date.now() - speakingAt < 1800;
    }

    function requestAvatarInterrupt() {
      localStorage.setItem(storageInterruptKey, String(Date.now()));
    }

    function inputIsSuppressed() {
      const suppressedUntil = Number(localStorage.getItem(storageInputSuppressedUntilKey) || 0);
      return suppressedUntil > Date.now();
    }

    function currentTranscript() {
      return (latestTranscript || finalTranscript || interimTranscript).trim();
    }

    function transcriptQuietLimit() {
      return interimTranscript ? transcriptSilenceLimitMs : finalTranscriptSilenceLimitMs;
    }

    function submitTranscript(text) {
      const cleaned = text.trim();
      if (!cleaned) return false;
      localStorage.setItem(storageModeKey, "on");
      localStorage.setItem(storageWaitingKey, String(Date.now()));
      setComponentValue({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        text: cleaned,
      });
      statusText.textContent = "";
      setButtonState("waiting");
      return true;
    }

    function drawLiveWave() {
      if (!analyser || !waveData) {
        drawIdleWave();
        return;
      }

      analyser.getByteTimeDomainData(waveData);
      let sum = 0;
      for (let index = 0; index < waveData.length; index += 1) {
        const value = (waveData[index] - 128) / 128;
        sum += value * value;
      }
      const volume = Math.min(1, Math.sqrt(sum / waveData.length) * 4.2);
      const now = Date.now();
      updateNoiseFloor(volume, now);
      if (listening) {
        if (calibrating(now)) {
          statusText.textContent = "Checking background noise...";
        } else if (statusText.textContent === "Checking background noise...") {
          statusText.textContent = "Listening...";
        }
        const hasTranscript = Boolean(currentTranscript());
        if (hasTranscript) {
          const threshold = Math.max(continuedSpeechThreshold, noiseFloor * 2.0 + 0.01);
          if (volume > threshold) {
            lastTranscriptAt = now;
          } else if (now - (lastTranscriptAt || lastVoiceAt) > transcriptQuietLimit()) {
            finishUtterance();
            return;
          }
        } else if (!calibrating(now) && volume > activeVoiceThreshold()) {
          if (!speechCandidateAt) speechCandidateAt = now;
          if (now - speechCandidateAt >= speechConfirmationMs) {
            heardSpeech = true;
            lastVoiceAt = now;
          }
        } else if (!heardSpeech) {
          speechCandidateAt = 0;
        } else if (heardSpeech && now - lastVoiceAt > noTranscriptSilenceLimitMs) {
          finishUtterance();
          return;
        }
      } else if (!calibrating(now) && isWaitingForAssistant() && !inputIsSuppressed()) {
        const speaking = assistantIsSpeaking();
        const bargeInThreshold = activeVoiceThreshold(true, speaking);
        if (volume > bargeInThreshold) {
          if (!interruptVoiceStartedAt) interruptVoiceStartedAt = now;
          if (now - interruptVoiceStartedAt > interruptHoldMs) {
            interruptAndListen();
          }
        } else {
          interruptVoiceStartedAt = 0;
        }
      }

      const width = canvas.width;
      const height = canvas.height;
      const bars = 34;
      const gap = 3;
      const barWidth = (width - gap * (bars - 1)) / bars;
      canvasContext.clearRect(0, 0, width, height);
      canvasContext.fillStyle = "rgba(9, 14, 24, 0.45)";
      canvasContext.fillRect(0, 0, width, height);

      for (let index = 0; index < bars; index += 1) {
        const sampleIndex = Math.floor((index / bars) * waveData.length);
        const sample = Math.abs((waveData[sampleIndex] - 128) / 128);
        const pulse = 0.35 + sample * 1.8 + volume * 1.2;
        const barHeight = Math.max(4, Math.min(height - 8, pulse * height * 0.45));
        const x = index * (barWidth + gap);
        const y = (height - barHeight) / 2;
        const intensity = Math.min(1, 0.38 + volume * 0.62);
        canvasContext.fillStyle = `rgba(${Math.round(82 + 45 * intensity)}, ${Math.round(214 + 22 * intensity)}, ${Math.round(180 + 20 * intensity)}, ${0.35 + intensity * 0.55})`;
        canvasContext.fillRect(x, y, barWidth, barHeight);
      }

      animationId = requestAnimationFrame(drawLiveWave);
    }

    async function startMeter() {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1,
        },
      });
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioContext();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;
      waveData = new Uint8Array(analyser.fftSize);
      const source = audioContext.createMediaStreamSource(mediaStream);
      source.connect(analyser);
      calibrationStartedAt = Date.now();
      calibrationSamples = [];
      noiseFloor = 0.008;
      speechCandidateAt = 0;
      drawLiveWave();
    }

    function startRecorder() {
      if (!mediaStream || !window.MediaRecorder || (mediaRecorder && mediaRecorder.state === "recording")) {
        return;
      }
      recordedChunks = [];
      const mimeCandidates = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/webm"];
      recordingMime = mimeCandidates.find((mime) => MediaRecorder.isTypeSupported(mime)) || "";
      mediaRecorder = recordingMime
        ? new MediaRecorder(mediaStream, { mimeType: recordingMime })
        : new MediaRecorder(mediaStream);
      recordingMime = mediaRecorder.mimeType || recordingMime || "audio/webm";
      mediaRecorder.addEventListener("dataavailable", (event) => {
        if (event.data && event.data.size) recordedChunks.push(event.data);
      });
      mediaRecorder.start(200);
    }

    function discardRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.onstop = null;
        mediaRecorder.stop();
      }
      mediaRecorder = null;
      recordedChunks = [];
      submissionPending = false;
    }

    function submitRecordedAudio(fallbackText = "") {
      if (submissionPending) return;
      submissionPending = true;
      const recorder = mediaRecorder;
      if (!recorder || recorder.state === "inactive") {
        submissionPending = false;
        const submitted = submitTranscript(fallbackText);
        stopMeter();
        if (!submitted) {
          statusText.textContent = "I did not catch speech yet.";
          setButtonState("idle");
        }
        return;
      }

      recorder.addEventListener("stop", () => {
        const blob = new Blob(recordedChunks, { type: recordingMime || "audio/webm" });
        mediaRecorder = null;
        recordedChunks = [];
        stopMeter();
        if (!blob.size) {
          submissionPending = false;
          submitTranscript(fallbackText);
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => {
          const encoded = String(reader.result || "").split(",", 2)[1] || "";
          setComponentValue({
            id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            text: "",
            transcript_hint: fallbackText,
            audio_b64: encoded,
            audio_mime: blob.type || recordingMime || "audio/webm",
          });
          localStorage.setItem(storageModeKey, "on");
          localStorage.setItem(storageWaitingKey, String(Date.now()));
          setButtonState("waiting");
          statusText.textContent = "Transcribing locally...";
          submissionPending = false;
        };
        reader.readAsDataURL(blob);
      }, { once: true });
      recorder.stop();
    }

    function stopMeter() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
        mediaStream = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
      analyser = null;
      waveData = null;
      drawIdleWave();
    }

    function finishUtterance() {
      if (!listening) return;
      listening = false;
      statusText.textContent = "";
      if (!heardSpeech && !currentTranscript()) {
        discardRecording();
        stopMeter();
        statusText.textContent = "I did not hear clear speech. Please try again.";
        setButtonState("idle");
        return;
      }
      if (recognition) {
        recognition.stop();
      } else {
        submitRecordedAudio(latestTranscript);
      }
    }

    function buildRecognition() {
      const instance = new SpeechRecognition();
      instance.lang = navigator.language || "en-IN";
      if (!["en", "hi"].includes(instance.lang.slice(0, 2).toLowerCase())) {
        instance.lang = "en-IN";
      }
      instance.continuous = true;
      instance.interimResults = true;

      instance.onresult = (event) => {
        interimTranscript = "";
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const transcript = event.results[index][0].transcript;
          if (event.results[index].isFinal) {
            finalTranscript = `${finalTranscript} ${transcript}`.trim();
          } else {
            interimTranscript = `${interimTranscript} ${transcript}`.trim();
          }
        }

        latestTranscript = [finalTranscript, interimTranscript].filter(Boolean).join(" ").trim();
        if (latestTranscript) {
          heardSpeech = true;
          const now = Date.now();
          lastVoiceAt = now;
          lastTranscriptAt = now;
        }
        if (listening) {
          preview.textContent = latestTranscript;
          statusText.textContent = "Listening...";
        }
      };

      instance.onerror = (event) => {
        recognition = null;
        if (interruptArmed && !listening) {
          if (event.error !== "no-speech" && event.error !== "aborted") {
            console.info(`Interrupt recognition paused: ${event.error}`);
          }
          return;
        }
        if (listening) {
          listening = false;
          statusText.textContent = "Using offline speech recognition...";
          submitRecordedAudio(currentTranscript());
        }
      };

      instance.onend = () => {
        recognition = null;
        if (interruptArmed && !listening) {
          finalTranscript = "";
          interimTranscript = "";
          latestTranscript = "";
          window.setTimeout(startInterruptMeter, resumeDelayMs);
          return;
        }
        const transcript = (latestTranscript || finalTranscript || interimTranscript).trim();
        submitRecordedAudio(transcript);
      };

      return instance;
    }

    async function startListening() {
      if (listening || interruptPending) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusText.textContent = "Microphone access is not available in this browser.";
        return;
      }

      finalTranscript = "";
      interimTranscript = "";
      latestTranscript = "";
      interruptArmed = false;
      localStorage.removeItem(storageWaitingKey);
      heardSpeech = false;
      speechCandidateAt = 0;
      lastVoiceAt = Date.now();
      lastTranscriptAt = 0;
      preview.textContent = "";
      listening = true;
      setButtonState("listening");
      statusText.textContent = "Listening...";

      try {
        await startMeter();
        startRecorder();
        if (SpeechRecognition) {
          recognition = buildRecognition();
          recognition.start();
        } else {
          statusText.textContent = "Listening with offline speech recognition...";
        }
      } catch (error) {
        console.error(error);
        listening = false;
        setButtonState("idle");
        stopMeter();
        statusText.textContent = "Microphone could not start.";
      }
    }

    async function startInterruptMeter() {
      if (listening || interruptPending || !isWaitingForAssistant()) return;
      try {
        interruptArmed = true;
        if (!mediaStream) await startMeter();
        if (!isWaitingForAssistant() || listening) return;
        if (SpeechRecognition && !recognition) {
          finalTranscript = "";
          interimTranscript = "";
          latestTranscript = "";
          recognition = buildRecognition();
          recognition.start();
        }
        setButtonState("waiting");
        statusText.textContent = assistantIsSpeaking()
          ? "KHOJ is speaking. Speak or tap to interrupt."
          : "Speak anytime. I can catch the next question.";
      } catch (error) {
        console.info("Interrupt listening could not start yet.", error);
      }
    }

    function endConversation() {
      localStorage.setItem(storageModeKey, "off");
      localStorage.removeItem(storageWaitingKey);
      listening = false;
      interruptArmed = false;
      if (recognition) {
        recognition.abort();
        recognition = null;
      }
      discardRecording();
      stopMeter();
      setButtonState("idle");
      statusText.textContent = "Conversation paused.";
    }

    function interruptAndListen() {
      if (listening || interruptPending) return;
      interruptPending = true;
      const recognitionAlreadyRunning = Boolean(recognition);
      requestAvatarInterrupt();
      localStorage.setItem(storageModeKey, "on");
      localStorage.removeItem(storageWaitingKey);
      interruptVoiceStartedAt = 0;
      interruptArmed = false;
      listening = true;
      heardSpeech = heardSpeech || Boolean(currentTranscript());
      lastVoiceAt = Date.now();
      preview.textContent = currentTranscript();
      setButtonState("listening");
      statusText.textContent = "Listening...";

      if (recognitionAlreadyRunning) {
        startRecorder();
        interruptPending = false;
        return;
      }

      listening = false;
      stopMeter();
      window.setTimeout(() => {
        interruptPending = false;
        startListening();
      }, resumeDelayMs);
    }

    function handleButtonClick() {
      if (listening) {
        finishUtterance();
        return;
      }
      if (isWaitingForAssistant()) {
        interruptAndListen();
        return;
      }
      localStorage.setItem(storageModeKey, "on");
      startListening();
    }

    function maybeResumeAfterAvatar() {
      const mode = localStorage.getItem(storageModeKey);
      const resumeAt = localStorage.getItem(storageResumeKey) || "";
      if (mode === "on" && resumeAt && resumeAt !== lastResumeAt && !listening) {
        lastResumeAt = resumeAt;
        localStorage.removeItem(storageWaitingKey);
        if (recognition && interruptArmed) {
          finalTranscript = "";
          interimTranscript = "";
          latestTranscript = "";
          interruptArmed = false;
          heardSpeech = false;
          lastVoiceAt = Date.now();
          lastTranscriptAt = 0;
          preview.textContent = "";
          listening = true;
          setButtonState("listening");
          statusText.textContent = "Listening...";
          return;
        }
        interruptArmed = false;
        stopMeter();
        window.setTimeout(startListening, resumeDelayMs);
      }
    }

    button.addEventListener("click", handleButtonClick);
    window.addEventListener("storage", maybeResumeAfterAvatar);
    window.setInterval(() => {
      maybeResumeAfterAvatar();
      startInterruptMeter();
    }, resumePollMs);

    setComponentReady();
    drawIdleWave();

    const waitingSince = Number(localStorage.getItem(storageWaitingKey) || 0);
    const waitingIsFresh = waitingSince > 0 && Date.now() - waitingSince < waitingFreshMs;
    if (localStorage.getItem(storageModeKey) === "on" && waitingIsFresh) {
      setButtonState("waiting");
      statusText.textContent = "I'll listen next. Speak or tap to interrupt.";
      startInterruptMeter();
    } else {
      localStorage.setItem(storageModeKey, "off");
      localStorage.removeItem(storageWaitingKey);
      setButtonState("idle");
    }
  </script>
</body>
</html>
