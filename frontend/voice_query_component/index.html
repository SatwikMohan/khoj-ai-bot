<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      margin: 0;
      background: transparent;
      color: #edf3ff;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      overflow: hidden;
    }

    .voice-query {
      border: 1px solid rgba(82, 214, 180, 0.24);
      border-radius: 12px;
      background: rgba(16, 24, 39, 0.7);
      padding: 10px;
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr);
      gap: 10px;
      align-items: center;
      box-sizing: border-box;
    }

    .mic-button {
      border: 1px solid rgba(82, 214, 180, 0.42);
      border-radius: 10px;
      background: rgba(82, 214, 180, 0.1);
      color: #b7ffeb;
      height: 38px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 760;
      cursor: pointer;
      white-space: nowrap;
    }

    .mic-button.listening {
      border-color: rgba(82, 214, 180, 0.72);
      background: rgba(82, 214, 180, 0.16);
      color: #d8fff4;
    }

    .mic-button.waiting {
      border-color: rgba(255, 214, 128, 0.55);
      background: rgba(255, 214, 128, 0.12);
      color: #ffe1a8;
    }

    .mic-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #52d6b4;
      box-shadow: 0 0 0 4px rgba(82, 214, 180, 0.16);
    }

    .mic-button.listening .mic-dot {
      animation: pulse 1s ease-in-out infinite;
    }

    .voice-panel {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(90px, 1fr) minmax(140px, 1.8fr);
      gap: 10px;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 38px;
      border-radius: 8px;
      background: rgba(9, 14, 24, 0.54);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .voice-status {
      color: #9fb0c7;
      font-size: 0.75rem;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .voice-preview {
      color: #edf3ff;
      font-size: 0.78rem;
      line-height: 1.3;
      min-height: 1.3em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }

    @media (max-width: 560px) {
      .voice-query,
      .voice-panel {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="voice-query">
    <button class="mic-button" id="micButton" type="button" aria-label="Start conversation">
      <span class="mic-dot"></span>
      <span id="micLabel">Start conversation</span>
    </button>
    <div class="voice-panel">
      <canvas id="waveCanvas" width="260" height="76" aria-label="Input volume waves"></canvas>
      <div>
        <div class="voice-status" id="voiceStatus">Tap once and speak naturally.</div>
        <div class="voice-preview" id="voicePreview"></div>
      </div>
    </div>
  </div>

  <script>
    const button = document.getElementById("micButton");
    const label = document.getElementById("micLabel");
    const statusText = document.getElementById("voiceStatus");
    const preview = document.getElementById("voicePreview");
    const canvas = document.getElementById("waveCanvas");
    const canvasContext = canvas.getContext("2d");
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const storageModeKey = "texmin_voice_conversation";
    const storageResumeKey = "texmin_voice_resume_at";
    const storageWaitingKey = "texmin_voice_waiting_since";
    const silenceLimitMs = 6500;
    const voiceThreshold = 0.025;

    let recognition = null;
    let listening = false;
    let mediaStream = null;
    let audioContext = null;
    let analyser = null;
    let waveData = null;
    let animationId = null;
    let finalTranscript = "";
    let interimTranscript = "";
    let latestTranscript = "";
    let heardSpeech = false;
    let lastVoiceAt = 0;
    let lastResumeAt = localStorage.getItem(storageResumeKey) || "";

    function sendStreamlitMessage(type, data) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }

    function setFrameHeight() {
      sendStreamlitMessage("streamlit:setFrameHeight", { height: 92 });
    }

    function setComponentReady() {
      sendStreamlitMessage("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight();
    }

    function setComponentValue(value) {
      sendStreamlitMessage("streamlit:setComponentValue", {
        value,
        dataType: "json",
      });
    }

    function drawIdleWave() {
      const width = canvas.width;
      const height = canvas.height;
      canvasContext.clearRect(0, 0, width, height);
      canvasContext.fillStyle = "rgba(9, 14, 24, 0.45)";
      canvasContext.fillRect(0, 0, width, height);
      const bars = 28;
      const gap = 3;
      const barWidth = (width - gap * (bars - 1)) / bars;
      for (let index = 0; index < bars; index += 1) {
        const phase = index / bars;
        const barHeight = 5 + Math.sin(phase * Math.PI) * 10;
        const x = index * (barWidth + gap);
        const y = (height - barHeight) / 2;
        canvasContext.fillStyle = "rgba(82, 214, 180, 0.22)";
        canvasContext.fillRect(x, y, barWidth, barHeight);
      }
    }

    function setButtonState(state) {
      button.classList.toggle("listening", state === "listening");
      button.classList.toggle("waiting", state === "waiting");
      if (state === "listening") {
        label.textContent = "Listening";
      } else if (state === "waiting") {
        label.textContent = "Waiting";
      } else {
        label.textContent = localStorage.getItem(storageModeKey) === "on"
          ? "Resume conversation"
          : "Start conversation";
      }
    }

    function submitTranscript(text) {
      const cleaned = text.trim();
      if (!cleaned) return false;
      localStorage.setItem(storageModeKey, "on");
      localStorage.setItem(storageWaitingKey, String(Date.now()));
      setComponentValue({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        text: cleaned,
      });
      statusText.textContent = "Sending that to KHOJ...";
      setButtonState("waiting");
      return true;
    }

    function drawLiveWave() {
      if (!analyser || !waveData) {
        drawIdleWave();
        return;
      }

      analyser.getByteTimeDomainData(waveData);
      let sum = 0;
      for (let index = 0; index < waveData.length; index += 1) {
        const value = (waveData[index] - 128) / 128;
        sum += value * value;
      }
      const volume = Math.min(1, Math.sqrt(sum / waveData.length) * 4.2);
      if (listening) {
        const now = Date.now();
        if (volume > voiceThreshold) {
          heardSpeech = true;
          lastVoiceAt = now;
        } else if (heardSpeech && now - lastVoiceAt > silenceLimitMs) {
          finishUtterance();
          return;
        }
      }

      const width = canvas.width;
      const height = canvas.height;
      const bars = 34;
      const gap = 3;
      const barWidth = (width - gap * (bars - 1)) / bars;
      canvasContext.clearRect(0, 0, width, height);
      canvasContext.fillStyle = "rgba(9, 14, 24, 0.45)";
      canvasContext.fillRect(0, 0, width, height);

      for (let index = 0; index < bars; index += 1) {
        const sampleIndex = Math.floor((index / bars) * waveData.length);
        const sample = Math.abs((waveData[sampleIndex] - 128) / 128);
        const pulse = 0.35 + sample * 1.8 + volume * 1.2;
        const barHeight = Math.max(4, Math.min(height - 8, pulse * height * 0.45));
        const x = index * (barWidth + gap);
        const y = (height - barHeight) / 2;
        const intensity = Math.min(1, 0.38 + volume * 0.62);
        canvasContext.fillStyle = `rgba(${Math.round(82 + 45 * intensity)}, ${Math.round(214 + 22 * intensity)}, ${Math.round(180 + 20 * intensity)}, ${0.35 + intensity * 0.55})`;
        canvasContext.fillRect(x, y, barWidth, barHeight);
      }

      animationId = requestAnimationFrame(drawLiveWave);
    }

    async function startMeter() {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioContext();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;
      waveData = new Uint8Array(analyser.fftSize);
      const source = audioContext.createMediaStreamSource(mediaStream);
      source.connect(analyser);
      drawLiveWave();
    }

    function stopMeter() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
        mediaStream = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
      analyser = null;
      waveData = null;
      drawIdleWave();
    }

    function finishUtterance() {
      if (!listening) return;
      listening = false;
      statusText.textContent = "I heard you. Let me answer...";
      if (recognition) {
        recognition.stop();
      } else {
        submitTranscript(latestTranscript);
        stopMeter();
      }
    }

    function buildRecognition() {
      const instance = new SpeechRecognition();
      instance.lang = navigator.language || "en-IN";
      if (!["en", "hi"].includes(instance.lang.slice(0, 2).toLowerCase())) {
        instance.lang = "en-IN";
      }
      instance.continuous = true;
      instance.interimResults = true;

      instance.onresult = (event) => {
        interimTranscript = "";
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const transcript = event.results[index][0].transcript;
          if (event.results[index].isFinal) {
            finalTranscript = `${finalTranscript} ${transcript}`.trim();
          } else {
            interimTranscript = `${interimTranscript} ${transcript}`.trim();
          }
        }

        latestTranscript = [finalTranscript, interimTranscript].filter(Boolean).join(" ").trim();
        if (latestTranscript) {
          heardSpeech = true;
          lastVoiceAt = Date.now();
        }
        preview.textContent = latestTranscript;
        statusText.textContent = "Listening...";
      };

      instance.onerror = (event) => {
        statusText.textContent = event.error === "not-allowed"
          ? "Microphone permission was blocked."
          : `Speech recognition paused: ${event.error}`;
        listening = false;
        setButtonState("idle");
        stopMeter();
      };

      instance.onend = () => {
        const transcript = (finalTranscript || latestTranscript || interimTranscript).trim();
        const submitted = submitTranscript(transcript);
        if (!submitted) {
          statusText.textContent = heardSpeech
            ? "I heard audio, but the browser did not return text. Try Chrome or Edge over HTTPS."
            : "I did not catch speech yet.";
          setButtonState("idle");
        }
        stopMeter();
      };

      return instance;
    }

    async function startListening() {
      if (!SpeechRecognition) {
        statusText.textContent = "Speech recognition works best in Chrome or Edge.";
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusText.textContent = "Microphone access is not available in this browser.";
        return;
      }

      finalTranscript = "";
      interimTranscript = "";
      latestTranscript = "";
      localStorage.removeItem(storageWaitingKey);
      heardSpeech = false;
      lastVoiceAt = Date.now();
      preview.textContent = "";
      listening = true;
      setButtonState("listening");
      statusText.textContent = "Listening...";

      try {
        await startMeter();
        recognition = buildRecognition();
        recognition.start();
      } catch (error) {
        console.error(error);
        listening = false;
        setButtonState("idle");
        stopMeter();
        statusText.textContent = "Microphone could not start.";
      }
    }

    function endConversation() {
      localStorage.setItem(storageModeKey, "off");
      localStorage.removeItem(storageWaitingKey);
      listening = false;
      if (recognition) {
        recognition.abort();
        recognition = null;
      }
      stopMeter();
      setButtonState("idle");
      statusText.textContent = "Conversation paused.";
    }

    function handleButtonClick() {
      const active = localStorage.getItem(storageModeKey) === "on";
      if (listening || active) {
        endConversation();
      } else {
        localStorage.setItem(storageModeKey, "on");
        startListening();
      }
    }

    function maybeResumeAfterAvatar() {
      const mode = localStorage.getItem(storageModeKey);
      const resumeAt = localStorage.getItem(storageResumeKey) || "";
      if (mode === "on" && resumeAt && resumeAt !== lastResumeAt && !listening) {
        lastResumeAt = resumeAt;
        localStorage.removeItem(storageWaitingKey);
        window.setTimeout(startListening, 500);
      }
    }

    button.addEventListener("click", handleButtonClick);
    window.addEventListener("storage", maybeResumeAfterAvatar);
    window.setInterval(maybeResumeAfterAvatar, 700);

    setComponentReady();
    drawIdleWave();

    const waitingSince = Number(localStorage.getItem(storageWaitingKey) || 0);
    const waitingIsFresh = waitingSince > 0 && Date.now() - waitingSince < 15000;
    if (localStorage.getItem(storageModeKey) === "on" && waitingIsFresh) {
      setButtonState("waiting");
      statusText.textContent = "I'll listen after KHOJ finishes speaking.";
    } else {
      localStorage.setItem(storageModeKey, "off");
      localStorage.removeItem(storageWaitingKey);
      setButtonState("idle");
    }
  </script>
</body>
</html>
